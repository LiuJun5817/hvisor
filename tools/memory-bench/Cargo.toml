[package]
name = "hvisor-memory-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
publish = false

# A separate host crate keeps std/Criterion out of the bare-metal build.
[workspace]

[features]
default = ["host-bench"]
host-bench = []
# Recognized by the shared memory module; the bare-metal test is never built here.
membench = []

[dependencies]
# Match the versions in the hypervisor's Cargo.lock.
log = "=0.4.29"
spin = "=0.10.0"
bitflags = "=2.10.0"
numeric-enum-macro = "=0.2.0"
bitmap-allocator = { git = "https://github.com/rcore-os/bitmap-allocator", rev = "03bd9909" }

[dev-dependencies]
criterion = { version = "=0.8.2", features = ["html_reports"] }

[lib]
test = false
doctest = false
bench = false

[[bench]]
name = "memory_ops"
harness = false

[[bench]]
name = "region_zone_ops"
harness = false

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
